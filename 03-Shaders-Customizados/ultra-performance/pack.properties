name=Ultra Performance
author=Custom
description=High-FPS optimized profile: lightweight rendering pipeline, soft shadows, disabled volumetric \
  cost, and crisp edge sharpening for ultra-smooth 100+ FPS gameplay.
base=default

options=exposure sharpening sunShadows shadowResolution antialiasing rainDensity

option.exposure.label=Exposure
option.exposure.tooltip=Image brightness.
option.exposure.range=0.5 1.5 0.05
option.exposure.default=1.0

option.sharpening.label=Smart Sharpening (DLAA-style)
option.sharpening.tooltip=Restores fine edge detail with near-zero performance cost.
option.sharpening.range=0.0 0.8 0.05
option.sharpening.default=0.4

option.sunShadows.label=Sun shadows
option.sunShadows.tooltip=Basic sun shadows.
option.sunShadows.default=true

option.shadowResolution.label=Shadow resolution
option.shadowResolution.values=1024 2048
option.shadowResolution.default=1024

option.antialiasing.label=Anti-aliasing (TAA)
option.antialiasing.default=true

option.rainDensity.label=Rain density
option.rainDensity.values=25 50 75 100
option.rainDensity.default=75

pipeline.shadows=${sunShadows}
pipeline.shadowResolution=${shadowResolution}
pipeline.shadowCascades=1
pipeline.flashlightShadow=false
pipeline.lampShadows=0
pipeline.farShadows=false
pipeline.farLamps=true
pipeline.volumetrics=false
pipeline.clouds=false
pipeline.indirect=false
pipeline.bloom=false
pipeline.puddles=true
pipeline.taa=${antialiasing}
pipeline.rainDensity=${rainDensity}
