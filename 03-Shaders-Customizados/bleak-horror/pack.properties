name=Bleak Horror
author=Custom
description=Oppressive survival horror: desaturated apocalyptic cold tones, deep pitch-black shadows, \
  cinematic vignette, film grain, and piercing lights.
base=default

options=exposure contrast desaturation coldShift vignette vignetteStrength filmGrain grainAmount \
  sunShadows shadowResolution flashlightShadow lampShadows volumetrics godrays puddles rainDensity antialiasing

option.exposure.label=Exposure
option.exposure.tooltip=Image brightness before tone mapping.
option.exposure.range=0.5 1.5 0.05
option.exposure.default=0.9

option.contrast.label=Contrast
option.contrast.tooltip=Contrast curve steepness. Higher values crush shadows for a darker, tenser world.
option.contrast.range=1.0 1.8 0.05
option.contrast.default=1.35

option.desaturation.label=Desaturation
option.desaturation.tooltip=How much color is drained from the world (0: normal colors, 1: total black & white).
option.desaturation.range=0.0 1.0 0.05
option.desaturation.default=0.45

option.coldShift.label=Cold Slate Shadows
option.coldShift.tooltip=Tints shadows with a cold, sickly blue-gray apocalyptic mood.
option.coldShift.range=0.0 1.0 0.05
option.coldShift.default=0.4

option.vignette.label=Vignette
option.vignette.tooltip=Darkens screen edges, narrowing peripheral vision for claustrophobic first-person immersion.
option.vignette.default=true

option.vignetteStrength.label=Vignette strength
option.vignetteStrength.tooltip=Intensity of edge darkening.
option.vignetteStrength.range=0.2 1.5 0.05
option.vignetteStrength.default=0.85

option.filmGrain.label=Film Grain
option.filmGrain.tooltip=Subtle analog noise that gives the scene texture and removes color banding.
option.filmGrain.default=true

option.grainAmount.label=Grain amount
option.grainAmount.tooltip=Strength of the film grain.
option.grainAmount.range=0.01 0.15 0.01
option.grainAmount.default=0.04
