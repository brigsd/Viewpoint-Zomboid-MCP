name=Photorealism
author=Custom
description=Enhanced cinematic photorealism: ACES film tonemapping, natural color balance, subtle lens blooming, \
  and crisp edge reconstruction.
base=default

options=exposure contrast saturation vibrance sharpening bloomHaze chromaticAberration \
  sunShadows shadowResolution flashlightShadow lampShadows volumetrics godrays puddles rainDensity antialiasing

option.exposure.label=Exposure
option.exposure.tooltip=Image brightness before tone mapping.
option.exposure.range=0.5 2.0 0.05
option.exposure.default=1.0

option.contrast.label=Contrast
option.contrast.tooltip=Tone curve contrast.
option.contrast.range=1.0 1.5 0.05
option.contrast.default=1.12

option.saturation.label=Saturation
option.saturation.tooltip=Color saturation.
option.saturation.range=0.5 1.6 0.05
option.saturation.default=1.06

option.vibrance.label=Vibrance
option.vibrance.tooltip=Enhance muted colors while preserving already vibrant ones and skin tones.
option.vibrance.range=0.0 0.8 0.05
option.vibrance.default=0.2

option.sharpening.label=Smart Clarity (Sharpen)
option.sharpening.tooltip=Restores fine micro-detail on foliage, fences, and textures (similar to DLAA clarity).
option.sharpening.range=0.0 0.8 0.05
option.sharpening.default=0.3

option.bloomHaze.label=Natural Bloom Haze
option.bloomHaze.tooltip=Soft atmospheric light dispersion around bright light sources.
option.bloomHaze.range=0.1 1.0 0.05
option.bloomHaze.default=0.4

option.chromaticAberration.label=Lens Dispersion
option.chromaticAberration.tooltip=Subtle optical dispersion at the outer edges of the lens.
option.chromaticAberration.range=0.0 0.005 0.0005
option.chromaticAberration.default=0.001
