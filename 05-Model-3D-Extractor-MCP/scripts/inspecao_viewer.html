<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Bancada de Inspeção 3D Headless</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #14171c; /* Fundo neutro de estúdio / auditoria */
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/",
      "three/examples/jsm/": "/node_modules/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<div id="canvas-container"></div>

<script type="module">
  import * as THREE from '/node_modules/three/build/three.module.js';
  import { OBJLoader } from '/node_modules/three/examples/jsm/loaders/OBJLoader.js';
  import { MTLLoader } from '/node_modules/three/examples/jsm/loaders/MTLLoader.js';

  let renderer, scene, camera;
  let currentModel = null;
  let modelBounds = null;
  let modelCenter = null;
  let modelSize = null;

  function init() {
    const container = document.getElementById('canvas-container');
    const width = window.innerWidth;
    const height = window.innerHeight;

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.setSize(width, height);
    renderer.setClearColor(0x14171c, 1.0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = false;
    container.appendChild(renderer.domElement);

    scene = new THREE.Scene();

    // Iluminação de estúdio calibrada para shaders PBR
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);

    // Luz principal frontal (key light)
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.3);
    keyLight.position.set(4, 7, 5);
    scene.add(keyLight);

    // Luz de preenchimento (fill light fria)
    const fillLight = new THREE.DirectionalLight(0xaac4e2, 0.7);
    fillLight.position.set(-5, 4, -4);
    scene.add(fillLight);

    // Luz de recorte (rim light quente)
    const rimLight = new THREE.DirectionalLight(0xffecd6, 0.5);
    rimLight.position.set(0, -3, -5);
    scene.add(rimLight);

    // Luz de topo para destacar superfícies horizontais e detalhes de topo
    const topLight = new THREE.DirectionalLight(0xffffff, 0.65);
    topLight.position.set(0, 10, 0);
    scene.add(topLight);

    window.__inspetorReady = true;
  }

  window.carregarObj = async function(objText, options = {}) {
    if (currentModel) {
      scene.remove(currentModel);
      currentModel = null;
    }

    const baseUrl = options.baseUrl || '/models/';
    const nomeModelo = options.nomeModelo || '';
    let materialsCreator = null;

    // LoadingManager para sincronizar carregamento de texturas com o WebGL
    let pendingCount = 0;
    const loadingManager = new THREE.LoadingManager();
    loadingManager.onStart = (url, loaded, total) => { pendingCount = total - loaded; };
    loadingManager.onProgress = (url, loaded, total) => { pendingCount = total - loaded; };
    loadingManager.onLoad = () => { pendingCount = 0; };
    loadingManager.onError = (url) => {
      console.warn("[LoadingManager Error]:", url);
      pendingCount = 0;
    };

    if (options.mtlText) {
      try {
        const mtlLoader = new MTLLoader(loadingManager);
        mtlLoader.setPath(baseUrl);
        mtlLoader.setResourcePath(baseUrl);
        materialsCreator = mtlLoader.parse(options.mtlText, baseUrl);
        materialsCreator.preload();
      } catch (e) {
        console.warn("[Viewer MTL] Aviso ao processar MTL:", e);
      }
    }

    const objLoader = new OBJLoader(loadingManager);
    if (materialsCreator) {
      objLoader.setMaterials(materialsCreator);
    }

    const object = objLoader.parse(objText);

    // Aguarda o término de todas as texturas registradas no LoadingManager
    if (pendingCount > 0) {
      await new Promise((resolve) => {
        const originalOnLoad = loadingManager.onLoad;
        loadingManager.onLoad = () => {
          if (originalOnLoad) originalOnLoad();
          resolve();
        };
        setTimeout(resolve, 2000);
      });
    }

    // Calcula estatísticas
    let vertexCount = 0;
    let faceCount = 0;

    const edgeMaterial = new THREE.LineBasicMaterial({
      color: 0x1a212d,
      linewidth: 1.2,
      transparent: true,
      opacity: 0.6
    });

    object.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = false;
        child.receiveShadow = false;

        let map = null;
        let diffuseColor = new THREE.Color(0xffffff);

        if (child.material) {
          if (Array.isArray(child.material)) {
            const m = child.material[0];
            if (m.map) map = m.map;
            if (m.color) diffuseColor = m.color.clone();
          } else {
            if (child.material.map) map = child.material.map;
            if (child.material.color) diffuseColor = child.material.color.clone();
          }
        }

        // Se não veio mapa pelo MTL, tenta carregar textura canônica diretamente
        if (!map && nomeModelo) {
          try {
            const texUrl = `${baseUrl}textures/${nomeModelo}_diffuse.png`;
            const texLoader = new THREE.TextureLoader(loadingManager);
            map = texLoader.load(texUrl);
          } catch (err) {
            console.warn("[Viewer Texture] Fallback não carregado:", err);
          }
        }

        if (map) {
          map.colorSpace = THREE.SRGBColorSpace;
          map.generateMipmaps = true;
          map.minFilter = THREE.LinearMipmapLinearFilter;
          map.magFilter = THREE.LinearFilter;
          map.needsUpdate = true;
        }

        // Material PBR (MeshStandardMaterial) limpo em alta definicao
        const pbrMaterial = new THREE.MeshStandardMaterial({
          color: map ? 0xffffff : diffuseColor,
          map: map || null,
          roughness: 0.52,
          metalness: 0.12,
          polygonOffset: true,
          polygonOffsetFactor: 1,
          polygonOffsetUnits: 1
        });

        child.material = pbrMaterial;

        if (child.geometry) {
          const geom = child.geometry;
          geom.computeVertexNormals();
          if (geom.attributes.position) {
            vertexCount += geom.attributes.position.count;
          }
          if (geom.index) {
            faceCount += geom.index.count / 3;
          } else if (geom.attributes.position) {
            faceCount += geom.attributes.position.count / 3;
          }

          // Adiciona arestas sutis para clareza da topologia técnica
          try {
            const edges = new THREE.EdgesGeometry(geom, 28);
            const line = new THREE.LineSegments(edges, edgeMaterial);
            child.add(line);
          } catch (e) {
            console.warn("[Viewer Edges] Erro ao gerar arestas:", e);
          }
        }
      }
    });

    if (pendingCount > 0) {
      await new Promise((resolve) => {
        loadingManager.onLoad = () => resolve();
        setTimeout(resolve, 1500);
      });
    }

    // Pequena pausa para garantir upload do buffer WebGL
    await new Promise((r) => setTimeout(r, 120));

    // Mede Bounding Box
    const box = new THREE.Box3().setFromObject(object);
    modelSize = new THREE.Vector3();
    box.getSize(modelSize);

    modelCenter = new THREE.Vector3();
    box.getCenter(modelCenter);

    modelBounds = {
      min: { x: box.min.x, y: box.min.y, z: box.min.z },
      max: { x: box.max.x, y: box.max.y, z: box.max.z },
      dimensoes: {
        largura_x: Number(modelSize.x.toFixed(4)),
        altura_y: Number(modelSize.y.toFixed(4)),
        profundidade_z: Number(modelSize.z.toFixed(4))
      },
      volume_m3: Number((modelSize.x * modelSize.y * modelSize.z).toFixed(6)),
      vertices: vertexCount,
      faces: Math.round(faceCount)
    };

    scene.add(object);
    currentModel = object;
    return modelBounds;
  };

  window.posicionarCamera = function(vista) {
    if (!modelBounds) return false;

    const width = window.innerWidth;
    const height = window.innerHeight;
    const aspect = width / height;

    // Tamanho do frustum ajustado para ocupar ~75-80% do quadro
    const maxDim = Math.max(modelSize.x, modelSize.y, modelSize.z);
    const frustumSize = Math.max(0.2, maxDim * 1.35);

    const left = -frustumSize * aspect / 2;
    const right = frustumSize * aspect / 2;
    const top = frustumSize / 2;
    const bottom = -frustumSize / 2;

    camera = new THREE.OrthographicCamera(left, right, top, bottom, 0.001, 100);

    const dist = 10;
    const cx = modelCenter.x;
    const cy = modelCenter.y;
    const cz = modelCenter.z;

    if (vista === 'isometrica') {
      // Ângulo axonométrico canônico de 45° horizontal e 35.264° de elevação
      const isoVector = new THREE.Vector3(1, 1 / Math.SQRT2, 1).normalize().multiplyScalar(dist);
      camera.position.set(cx + isoVector.x, cy + isoVector.y, cz + isoVector.z);
      camera.up.set(0, 1, 0);
      camera.lookAt(cx, cy, cz);
    } else if (vista === 'frontal') {
      // Olhando para frente (+Z em direção a -Z)
      camera.position.set(cx, cy, cz + dist);
      camera.up.set(0, 1, 0);
      camera.lookAt(cx, cy, cz);
    } else if (vista === 'direita' || vista === 'lateral') {
      // Olhando para a lateral direita (+X em direção a -X)
      camera.position.set(cx + dist, cy, cz);
      camera.up.set(0, 1, 0);
      camera.lookAt(cx, cy, cz);
    } else if (vista === 'superior' || vista === 'topo') {
      // Olhando de cima (+Y para baixo), alinhando topo para -Z (frente fica para baixo)
      camera.position.set(cx, cy + dist, cz);
      camera.up.set(0, 0, -1);
      camera.lookAt(cx, cy, cz);
    }

    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    return true;
  };

  init();
</script>
</body>
</html>
